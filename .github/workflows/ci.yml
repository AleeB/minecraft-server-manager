name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aleeb/minecraft-server-manager

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controllo sintassi
        run: npm run check
      - name: Test
        run: npm test

  nginx:
    name: Verifica configurazione nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script di avvio
        run: sh -n deploy/nginx/start.sh && sh -n deploy/certbot/run.sh
      - name: nginx -t (senza certificato e con certificato di prova)
        run: |
          mkdir -p /tmp/le/live/test.example.com /tmp/empty
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=test.example.com" \
            -keyout /tmp/le/live/test.example.com/privkey.pem -out /tmp/le/live/test.example.com/fullchain.pem
          for certs in /tmp/empty /tmp/le; do
            docker run --rm -e DOMAIN=test.example.com -e MANAGER_PORT=8080 \
              -v "$PWD/deploy/nginx:/etc/nginx/mc:ro" -v "$certs:/etc/letsencrypt:ro" \
              --entrypoint sh nginx:1.27-alpine /etc/nginx/mc/start.sh check
          done

  build:
    name: Build immagine
    needs: [test, nginx]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (e push su main)
        uses: docker/build-push-action@v6
        with:
          context: manager
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
