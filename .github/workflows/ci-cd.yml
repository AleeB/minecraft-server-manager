name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aleeb/minecraft-server-manager

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controllo sintassi
        run: npm run check
      - name: Test
        run: npm test

  nginx:
    name: Verifica configurazione nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script di avvio
        run: sh -n deploy/nginx/start.sh && sh -n deploy/certbot/run.sh
      - name: nginx -t (senza certificato e con certificato di prova)
        run: |
          mkdir -p /tmp/le/live/test.example.com /tmp/empty
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=test.example.com" \
            -keyout /tmp/le/live/test.example.com/privkey.pem -out /tmp/le/live/test.example.com/fullchain.pem
          for certs in /tmp/empty /tmp/le; do
            docker run --rm -e DOMAIN=test.example.com -e MANAGER_PORT=8080 \
              -v "$PWD/deploy/nginx:/etc/nginx/mc:ro" -v "$certs:/etc/letsencrypt:ro" \
              --entrypoint sh nginx:1.27-alpine /etc/nginx/mc/start.sh check
          done

  build:
    name: Build immagine
    needs: [test, nginx]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (e push su main)
        uses: docker/build-push-action@v6
        with:
          context: manager
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy in produzione
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.PROD_DEPLOY_DIR || '/opt/mc-manager' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          HOST: ${{ secrets.PROD_HOST }}
          PORT: ${{ secrets.PROD_PORT || '22' }}
        run: |
          test -n "$SSH_KEY" && test -n "$HOST" || { echo "::error::Mancano i secret PROD_HOST / PROD_SSH_KEY (vedi deploy/README.md)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::PROD_KNOWN_HOSTS non impostato: uso ssh-keyscan (meno sicuro)"
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host prod
            HostName $HOST
            User ${{ secrets.PROD_USER }}
            Port $PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          CFG

      - name: Copia i file di deploy
        run: |
          ssh prod "mkdir -p '$DEPLOY_DIR'"
          scp -r deploy/docker-compose.yml deploy/nginx deploy/certbot "prod:$DEPLOY_DIR/"
          ssh prod "test -f '$DEPLOY_DIR/.env'" || { echo "::error::Manca $DEPLOY_DIR/.env sulla VPS (copia deploy/.env.example e imposta MANAGER_PASSWORD)"; exit 1; }

      - name: Aggiorna il manager
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh prod "cd '$DEPLOY_DIR' && \
            export IMAGE='${{ env.IMAGE }}' IMAGE_TAG='${{ github.sha }}' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            if docker compose config --services | grep -qx nginx; then docker compose exec -T nginx sh /etc/nginx/mc/start.sh reload; fi && \
            docker logout ghcr.io && \
            docker image prune -f"

      - name: Verifica salute
        run: |
          for i in $(seq 1 20); do
            if ssh prod "docker inspect -f '{{.State.Health.Status}}' mc-manager" | grep -q healthy; then
              echo "Manager in salute"; exit 0
            fi
            sleep 3
          done
          ssh prod "docker logs --tail 50 mc-manager"
          echo "::error::Il manager non è diventato healthy"; exit 1
