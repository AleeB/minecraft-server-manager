# Compose di produzione. Si usa dalla copia del repository sul server:
#   cd /opt/mc-manager/deploy && ./update.sh
# Le variabili vengono da deploy/.env (creato una volta a mano, vedi deploy/README.md).

services:
  manager:
    # Di default scarica l'immagine testata dalla CI; con "./update.sh --build" la costruisce sul server.
    image: ${IMAGE:-ghcr.io/aleeb/minecraft-server-manager}:${IMAGE_TAG:-latest}
    build: ../manager
    container_name: mc-manager
    restart: unless-stopped
    # Rete dell'host: il manager vede le porte davvero libere e i server Minecraft
    # restano raggiungibili anche durante i suoi aggiornamenti.
    network_mode: host
    environment:
      HOST: ${MANAGER_HOST:-0.0.0.0}
      PORT: ${MANAGER_PORT:-8080}
      MANAGER_USER: ${MANAGER_USER:-admin}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:?Imposta MANAGER_PASSWORD in .env}
      SERVERS_DIR: ${SERVERS_DIR:-/srv/minecraft/servers}
      MEMORY_RESERVE: ${MEMORY_RESERVE:-1g}
      HEAP_SHARE: ${HEAP_SHARE:-0.8}
      RAM_BUDGET: ${RAM_BUDGET:-}
      RESTART_WARNING: ${RESTART_WARNING:-60}
      WORLD_UPLOAD_MAX: ${WORLD_UPLOAD_MAX:-2g}
      WORLD_EXTRACT_MAX: ${WORLD_EXTRACT_MAX:-20g}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Stesso percorso dentro e fuori: Docker monta le cartelle dei server dal percorso dell'host.
      - ${SERVERS_DIR:-/srv/minecraft/servers}:${SERVERS_DIR:-/srv/minecraft/servers}

  # HTTPS: nginx come reverse proxy + certbot per i certificati Let's Encrypt.
  # Si attivano con COMPOSE_PROFILES=https in .env (servono DOMAIN e LETSENCRYPT_EMAIL).
  # In quel caso imposta MANAGER_HOST=127.0.0.1: il manager sarà raggiungibile solo tramite nginx.
  nginx:
    image: nginx:1.27-alpine
    container_name: mc-manager-nginx
    profiles: ["https"]
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-}
      MANAGER_PORT: ${MANAGER_PORT:-8080}
      WORLD_UPLOAD_MAX: ${WORLD_UPLOAD_MAX:-2g}
    entrypoint: ["sh", "/etc/nginx/mc/start.sh"]
    volumes:
      - ./nginx:/etc/nginx/mc:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 1m
      timeout: 5s

  # Bot che ottiene il certificato e lo rinnova (controllo ogni 12 ore).
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: mc-manager-certbot
    profiles: ["https"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    entrypoint: ["sh", "/opt/certbot/run.sh"]
    volumes:
      - ./certbot/run.sh:/opt/certbot/run.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot-webroot:
